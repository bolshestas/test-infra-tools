name: CI

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t $REGISTRY/$IMAGE_NAME:$GITHUB_SHA .

      - name: Push Docker image
        if: github.event_name == 'push'
        run: docker push $REGISTRY/$IMAGE_NAME:$GITHUB_SHA

      - name: Checkout Gitops repository
        if: github.event_name == 'push'
        uses: actions/checkout@v6
        with:
          repository: bolshestas/test-infra-gitops
          path: gitops
          persist-credentials: false

      - name: Verify GitOps manifests
        if: github.event_name == 'push'
        run: |
          grep -nE 'image:|imagePullPolicy:' \
            gitops/apps/todo/base/app-deployment.yaml \
            gitops/apps/todo/base/app-consumer-deployment.yaml

      - name: Update GitOps image references
        if: github.event_name == 'push'
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
        run: |
          for file in \
            gitops/apps/todo/base/app-deployment.yaml \
            gitops/apps/todo/base/app-consumer-deployment.yaml
          do
            sed -i -E \
              "s#^([[:space:]]*)image: (getting-started:[^[:space:]]+|ghcr.io/bolshestas/test-infra-tools:[^[:space:]]+)#\1image: ${IMAGE}#" \
              "$file"

            grep -qF "image: ${IMAGE}" "$file"
          done
      - name: Show GitOps diff
        if: github.event_name == 'push'
        run: |
          git -C gitops diff --check
          git -C gitops diff -- \
            apps/todo/base/app-deployment.yaml \
            apps/todo/base/app-consumer-deployment.yaml
